name: Internal test
on:
  workflow_dispatch:
env:
  API_URL: ${{secrets.API_URL}}
  KEYSTORE: ${{secrets.KEYSTORE}}
  KEYSTORE_PASS: ${{secrets.KEYSTORE_PASS}}
jobs:
  build:
    name: Flutter Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.38.5

      # Get flutter dependencies.
      - run: flutter pub get

      # Check for any formatting issues in the code.
      - run: dart format --set-exit-if-changed .

      # Statically analyze the Dart code for any errors.
      - run: flutter analyze .

      # Run widget tests for our flutter project.
      - run: flutter test
      
      - name: Configure keystore
        run: echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
      
      - name: Build app blundle
        run: flutter build appbundle --dart-define=API_URL="$API_URL"

      - name: Verify app bundle target SDK
        run: |
          curl --fail --location --output bundletool.jar https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar bundletool.jar dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab | tee manifest.xml
          grep -q 'android:targetSdkVersion="35"' manifest.xml

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Push beta release to Google Playstore
        run: |
          sha256sum ../build/app/outputs/bundle/release/app-release.aab
          bundle exec fastlane internal
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        working-directory: android
